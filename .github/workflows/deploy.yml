name: Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger the deployment from GitHub UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'

      # Match the npm version pinned in package.json "packageManager" so the
      # lockfile is read by the same npm that wrote it
      - name: Pin npm version
        run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - name: Install Dependencies and Build
        working-directory: .
        run: |
          npm ci
          npm run build

      - name: Copy files to Ubuntu server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Copy the built output, package.json, and lockfile.
          # packages/shared/dist is required at runtime by the API, which ships
          # raw dist and require()s @pantry-finder/shared/logging (the web app
          # bundles shared into .output, so it doesn't need it shipped).
          # tools/crawler/dist is the crawler worker that executes runs
          # started from the admin.
          source: "package.json,package-lock.json,apps/api/dist,apps/api/package.json,apps/api/package-lock.json,apps/web/.output,apps/web/package.json,apps/web/package-lock.json,apps/admin/.output,apps/admin/package.json,packages/shared/dist,packages/shared/package.json,tools/crawler/dist,tools/crawler/package.json"
          target: ${{ secrets.REMOTE_TARGET }}

      - name: Install Production Dependencies & Restart REST API, Web App and Admin
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ${{ secrets.REMOTE_TARGET }}/apps/api

            cat > .env.production << 'EOF'
            FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            LOG_SERVICE_ACCOUNT_JSON=${{ secrets.LOG_SERVICE_ACCOUNT_JSON }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            COOKIE_DOMAIN=pantryfinder.org
            API_NINJAS_KEY=${{ secrets.API_NINJAS_KEY }}
            GEOCODIO_API_KEY=${{ secrets.GEOCODIO_API_KEY }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
            GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}
            GA_API_SECRET=${{ secrets.GA_API_SECRET }}
            REDIS_URL=redis://127.0.0.1:6379
            EOF

            cd ${{ secrets.REMOTE_TARGET }}/apps/web

            cat > .env.production << 'EOF'
            NUXT_PUBLIC_API_BASE=${{ secrets.NUXT_PUBLIC_API_BASE }}
            NUXT_API_BASE_INTERNAL=${{ secrets.NUXT_API_BASE_INTERNAL }}
            NUXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            NUXT_PUBLIC_MICROSOFT_CLIENT_ID=${{ secrets.MICROSOFT_CLIENT_ID }}
            NUXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}
            NUXT_PUBLIC_PHOTON_BASE=${{ secrets.PHOTON_BASE }}
            LOG_SERVICE_ACCOUNT_JSON=${{ secrets.LOG_SERVICE_ACCOUNT_JSON }}
            EOF

            cd ${{ secrets.REMOTE_TARGET }}/apps/admin

            cat > .env.production << 'EOF'
            NUXT_PUBLIC_API_BASE=${{ secrets.NUXT_PUBLIC_API_BASE }}
            EOF

            cd ${{ secrets.REMOTE_TARGET }}/tools/crawler

            cat > .env.production << 'EOF'
            CRAWLER_ENV=prod
            FIREBASE_SERVICE_ACCOUNT_JSON=${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
            DEEPSEEK_MODEL=${{ secrets.DEEPSEEK_MODEL }}
            CRAWLER_CONTACT=${{ secrets.CRAWLER_CONTACT }}
            REDIS_URL=redis://127.0.0.1:6379
            EOF

            # Install only production dependencies on the server, with the npm
            # version pinned in package.json "packageManager" (same as CI)
            cd ${{ secrets.REMOTE_TARGET }}
            npx -y "$(node -p "require('./package.json').packageManager")" ci --omit=dev

            sudo systemctl restart pantry-finder-api
            sudo systemctl restart pantry-finder-web
            sudo systemctl restart pantry-finder-admin
            sudo systemctl restart pantry-finder-crawler
            
            echo "Deployment files synced and dependencies installed."
