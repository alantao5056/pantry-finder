function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

function haversineDistance(lat1, lon1, lat2, lon2) {
  const R = 3959;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function parseTime(t) {
  if (!t) return 0;
  const [time, period] = t.split(' ');
  let [h, m] = time.split(':').map(Number);
  if (period === 'PM' && h !== 12) h += 12;
  if (period === 'AM' && h === 12) h = 0;
  return h * 60 + m;
}
function isOpenNow(schedules) {
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const today = days[new Date().getDay()];
  const now   = new Date().getHours() * 60 + new Date().getMinutes();
  return schedules.some(s => s.weekDay === today && s.start && now >= parseTime(s.start) && now <= parseTime(s.end));
}
function isOpenToday(schedules) {
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const today = days[new Date().getDay()];
  return schedules.some(s => s.weekDay === today && s.start);
}
function getUniqueFoods(services) {
  const foods = new Set();
  services.forEach(s => s.food.forEach(f => foods.add(f)));
  return [...foods];
}
function getScheduleDays(schedules) {
  const seen = new Set();
  return schedules.filter(s => s.weekDay && s.start && !seen.has(s.weekDay) && seen.add(s.weekDay));
}
function foodEmoji(food) {
  const map = {
    'Dairy':'🥛','Eggs':'🥚','Fruits & Vegetables':'🥦','Meat':'🥩',
    'Shelf Stable/Non-Perishable Goods':'🥫','Prepared Food / Grab and Go':'🍱',
    'Household Products':'🧹','Toiletries / Hygiene Products':'🧴',
    'Pet Food / Supplies':'🐾','Diapers':'👶','Other':'📦',
  };
  return map[food] || '🍽️';
}

function PantryCard({ pantry, loved, followed, loveCounts, onLove, onFollow, onSelect, distance }) {
  const openNow   = isOpenNow(pantry.schedules);
  const openToday = isOpenToday(pantry.schedules);
  const allFoods  = getUniqueFoods(pantry.services);
  const foods     = allFoods.slice(0, 4);
  const days      = getScheduleDays(pantry.schedules);
  const loveCount = loveCounts[pantry.id] ?? pantry.loves;

  const uniqueServices = pantry.services.filter((s, i, a) => a.findIndex(x => x.name === s.name) === i);
  const MAX_SVC = 3;
  const visibleSvc = uniqueServices.slice(0, MAX_SVC);
  const extraSvc   = uniqueServices.length - MAX_SVC;

  const svcColor = cat => {
    if (cat === 'Food Program')                    return { bg:'#f0faf4', color:'#1e7a47', border:'#b8e8cc' };
    if (cat === 'Healthcare Screenings/Referrals') return { bg:'#eff6ff', color:'#1d4ed8', border:'#bfdbfe' };
    if (cat === 'Housing Assistance')              return { bg:'#fff7ed', color:'#c2410c', border:'#fed7aa' };
    return { bg:'#f5f3ff', color:'#6d28d9', border:'#ddd6fe' };
  };

  return (
    <div className="pantry-card" onClick={() => onSelect(pantry)}>
      {/* Accent bar */}
      <div style={{ height:4, background:'linear-gradient(90deg,#1a2e1e,#1e7a47,#2d9a5f)', flexShrink:0 }} />

      <div style={{ padding:'18px 20px', flex:1, display:'flex', flexDirection:'column' }}>

        {/* Row 1 — Name + Status */}
        <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:10, marginBottom:8 }}>
          <h3 style={{ fontFamily:"'Playfair Display',Georgia,serif", fontSize:17, fontWeight:600, color:'#1a2e1e', lineHeight:1.3, flex:1, margin:0 }}>
            {pantry.name}
          </h3>
          <div style={{ flexShrink:0 }}>
            {openNow   && <span style={{ background:'#dcf4e6', color:'#1e7a47', fontSize:10, fontWeight:700, padding:'3px 8px', borderRadius:100, letterSpacing:'0.3px', whiteSpace:'nowrap' }}>OPEN NOW</span>}
            {!openNow && openToday   && <span style={{ background:'#faf5ec', color:'#a07850', fontSize:10, fontWeight:700, padding:'3px 8px', borderRadius:100, whiteSpace:'nowrap' }}>OPEN TODAY</span>}
            {!openNow && !openToday && pantry.schedules.length > 0 && <span style={{ background:'#f5f5f2', color:'#8aab97', fontSize:10, fontWeight:600, padding:'3px 8px', borderRadius:100, whiteSpace:'nowrap' }}>CLOSED TODAY</span>}
          </div>
        </div>

        {/* Row 2 — Address */}
        <div style={{ display:'flex', alignItems:'flex-start', color:'#4a6355', fontSize:12, marginBottom:6 }}>
          <span style={{ flexShrink:0, width:18, display:'flex', justifyContent:'center', marginTop:2 }}>
            <IcoMapPin size={12} color="#8aab97" />
          </span>
          <span style={{ lineHeight:1.4 }}>{pantry.address}</span>
        </div>

        {/* Row 3 — Distance */}
        {distance !== undefined && (
          <div style={{ display:'flex', alignItems:'center', fontSize:12, color:'#2d9a5f', fontWeight:600, marginBottom:10 }}>
            <span style={{ flexShrink:0, width:18, display:'flex', justifyContent:'center' }}>📍</span>
            <span>{distance.toFixed(1)} mi away</span>
          </div>
        )}
        {/* Divider */}
        {(days.length > 0 || foods.length > 0 || uniqueServices.length > 0) && (
          <div style={{ height:1, background:'#edf3ef', margin:'6px 0 12px' }} />
        )}

        {/* Schedule */}
        {days.length > 0 && (
          <div style={{ display:'flex', alignItems:'flex-start', gap:5, fontSize:12, color:'#4a6355', marginBottom:8, lineHeight:1.5 }}>
            <IcoClock size={12} color="#8aab97" style={{ flexShrink:0, marginTop:2 }} />
            <div>
              {days.slice(0,2).map((s,i) => (
                <span key={i}>{i>0 && ' · '}{s.weekDay.slice(0,3)} {s.start}–{s.end}</span>
              ))}
              {days.length > 2 && <span style={{ color:'#8aab97' }}> +{days.length-2} more</span>}
            </div>
          </div>
        )}

        {/* Available Food */}
        {foods.length > 0 && (
          <div style={{ marginBottom:10 }}>
            <div style={{ fontSize:10, fontWeight:700, color:'#8aab97', letterSpacing:'0.6px', textTransform:'uppercase', marginBottom:6 }}>Available Food</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
              {foods.map(f => (
                <span key={f} style={{ background:'#f0faf4', color:'#1e7a47', fontSize:11, fontWeight:500, padding:'3px 8px', borderRadius:100, border:'1px solid #b8e8cc', display:'inline-flex', alignItems:'center', gap:4 }}>
                  <span style={{ display:'inline-flex', justifyContent:'center', width:16, flexShrink:0, fontSize:12 }}>{foodEmoji(f)}</span>{f}
                </span>
              ))}
              {allFoods.length > 4 && (
                <span style={{ background:'#f5f5f2', color:'#8aab97', fontSize:11, padding:'3px 8px', borderRadius:100 }}>+{allFoods.length-4} more</span>
              )}
            </div>
          </div>
        )}

        {/* Row 6 — Services Offered */}
        {uniqueServices.length > 0 && (
          <div style={{ marginBottom:4 }}>
            <div style={{ fontSize:10, fontWeight:700, color:'#8aab97', letterSpacing:'0.6px', textTransform:'uppercase', marginBottom:6 }}>Services Offered</div>
            <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
              {visibleSvc.map((svc,i) => {
                const c = svcColor(svc.category);
                return (
                  <span key={i} style={{ background:c.bg, color:c.color, border:`1px solid ${c.border}`, fontSize:11, fontWeight:500, padding:'3px 9px', borderRadius:100 }}>
                    {svc.name}
                  </span>
                );
              })}
              {extraSvc > 0 && (
                <span style={{ background:'#f5f5f2', color:'#8aab97', fontSize:11, padding:'3px 8px', borderRadius:100 }}>+{extraSvc} more</span>
              )}
            </div>
          </div>
        )}
      </div>

      {/* Footer — Heart count */}
      <div style={{ padding:'0 20px 14px', display:'flex', alignItems:'center' }}>
        <div style={{ display:'flex', alignItems:'center', gap:5 }}>
          <IcoHeart size={13} fill="#e11d48" color="#e11d48" />
          <span style={{ fontSize:13, fontWeight:600, color:'#e11d48' }}>{loveCount}</span>
          <span style={{ fontSize:12, color:'#8aab97' }}>loves</span>
        </div>
      </div>
    </div>
  );
}

  const containerRef = useRef(null);

  const markersRef   = useRef({});   // keyed by pantry id
  const lRef         = useRef(null); // Leaflet reference

  const makeIcon = (p, selected) => {
    const L     = lRef.current;
    const loved = lovedPantries.has(p.id);
    const color = selected ? '#f97316'
                : loved    ? '#e11d48'
                : isOpenNow(p.schedules) ? '#1e7a47'
                : '#8aab97';
    const size  = selected ? 44 : 36;
    const ring  = selected ? '3px solid #fff' : '2.5px solid white';
    const shadow = selected
      ? '0 0 0 3px rgba(249,115,22,0.35), 0 4px 14px rgba(0,0,0,0.25)'
      : '0 3px 10px rgba(0,0,0,0.2)';
    return L.divIcon({
      className: '',
      html: `<div style="background:${color};color:white;border-radius:50% 50% 50% 0;width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:${selected?17:15}px;font-weight:700;box-shadow:${shadow};cursor:pointer;border:${ring};transform:rotate(-45deg)"><span style="transform:rotate(45deg)">${p.name.charAt(0)}</span></div>`,
      iconSize: [size, size], iconAnchor: [size/2, size],
    });
  };

  useEffect(() => {
    const initMap = () => {
      if (!containerRef.current) return;
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
      const L   = window.L;
      lRef.current = L;
      markersRef.current = {};
      const map = L.map(containerRef.current, { center:[42.36,-71.2], zoom:12 });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      pantries.forEach(p => {
        const marker = L.marker([p.latitude, p.longitude], { icon: makeIcon(p, false) }).addTo(map);
        marker.bindPopup(`<div style="font-family:'DM Sans',sans-serif;min-width:180px"><strong style="font-family:'Playfair Display',serif;font-size:14px">${p.name}</strong><br><small style="color:#8aab97">${p.address}</small><br><br><button onclick="window._pantrySelect('${p.id}')" style="background:#1e7a47;color:white;border:none;border-radius:8px;padding:5px 12px;font-size:12px;cursor:pointer;width:100%">View Details</button></div>`);
        markersRef.current[p.id] = marker;
      });
      window._pantrySelect = id => { const p = pantries.find(x => x.id === id); if (p) onSelectPantry(p); };
      mapRef.current = map;
    };
    const loadLeaflet = () => {
      if (!document.getElementById('leaflet-css')) {
        const css = document.createElement('link');
        css.id = 'leaflet-css'; css.rel = 'stylesheet';
        css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        document.head.appendChild(css);
      }
      if (window.L) { initMap(); return; }
      if (document.getElementById('leaflet-js')) {
        const poll = setInterval(() => { if (window.L) { clearInterval(poll); initMap(); }}, 80);
        return;
      }
      const js = document.createElement('script');
      js.id = 'leaflet-js';
      js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      js.onload = initMap; document.head.appendChild(js);
    };
    loadLeaflet();
    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }};
  }, [pantries, lovedPantries]);

  /* Pan + highlight when selectedPantryId changes */
  useEffect(() => {
    if (!mapRef.current || !lRef.current) return;
    pantries.forEach(p => {
      const marker = markersRef.current[p.id];
      if (!marker) return;
      marker.setIcon(makeIcon(p, p.id === selectedPantryId));
    });
    if (selectedPantryId) {
      const p = pantries.find(x => x.id === selectedPantryId);
      if (p) mapRef.current.flyTo([p.latitude, p.longitude], 15, { duration: 0.8 });
    }
  }, [selectedPantryId]);

  return <div ref={containerRef} style={{ width:'100%', height:'100%', borderRadius:16, overflow:'hidden' }} />;
}

  'Healthcare Screenings/Referrals': { dot:'#3b82f6', bg:'#eff6ff', border:'#bfdbfe', text:'#1d4ed8' },
  'Housing Assistance':              { dot:'#f97316', bg:'#fff7ed', border:'#fed7aa', text:'#c2410c' },

  'Other':                           { dot:'#6b7280', bg:'#f9fafb', border:'#e5e7eb', text:'#374151' },
};
function svcTheme(cat) { return SVC_THEME[cat] || SVC_THEME['Other']; }

/* Day abbreviation colors — Mon-Fri teal, Sat blue, Sun amber */
const DAY_COLORS = {
  Monday:'#0e7490', Tuesday:'#0e7490', Wednesday:'#0e7490',
  Thursday:'#0e7490', Friday:'#0e7490', Saturday:'#4f46e5', Sunday:'#d97706',
};

function ServiceScheduleRow({ sched }) {
  if (!sched.weekDay && sched.notes) {
    return (
      <div style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:'1px solid #f0f4f1' }}>
        <span style={{ fontSize:12, color:'#4b5563', fontStyle:'italic' }}>{sched.notes}</span>
      </div>
    );

  if (!sched.weekDay || !sched.start) return null;
  const dayColor = DAY_COLORS[sched.weekDay] || '#0e7490';
  return (
    <div style={{ display:'flex', alignItems:'center', gap:10, padding:'7px 0', borderBottom:'1px solid #f0f4f1' }}>
      <span style={{
        flexShrink:0, minWidth:32, fontSize:11, fontWeight:700, color:dayColor,
        background: dayColor+'18', borderRadius:6, padding:'2px 7px', textAlign:'center', letterSpacing:'0.02em'
      }}>{sched.weekDay.slice(0,3).toUpperCase()}</span>
      <span style={{ flex:1, fontSize:13, color:'#2a3a30', fontWeight:500 }}>
        {sched.start} – {sched.end}

      {sched.notes && (
        <span style={{ fontSize:12, color:'#374151', background:'#eef2ef', borderRadius:100, padding:'2px 10px', whiteSpace:'nowrap', maxWidth:200, overflow:'hidden', textOverflow:'ellipsis' }}>
          {sched.notes}

}

                  </span>
                ) : openToday ? (
                  <span style={{ display:'inline-flex', alignItems:'center', gap:5, background:'#fffbeb', border:'1px solid #fcd34d', borderRadius:100, padding:'3px 10px', fontSize:11, fontWeight:700, color:'#b45309', letterSpacing:'0.03em', flexShrink:0 }}>
                    OPEN TODAY

                      <div style={{ flex:1, minWidth:0 }}>
                        <span style={{ fontWeight:600, fontSize:13.5, color:'#111827' }}>{svc.name}</span>
                        <span style={{ fontSize:12, color:th.text, marginLeft:8 }}>
                          {svc.program && svc.program !== svc.category ? svc.program : svc.category}
                        </span>
                      </div>
                      <span style={{ flexShrink:0, color:'#9ca3af', marginLeft:2 }}><Chevron open={isOpen} /></span>
                    </button>

                    {/* Collapsible content: food pills + schedule rows */}
                    {isOpen && (
                      <div style={{ padding:'10px 16px 12px', background:'#fff', display:'flex', flexDirection:'column', gap:10 }}>
                        {/* Food pills — same style as Available Food section */}
                        {svc.food && [...new Set(svc.food)].length > 0 && (
                          <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                            {[...new Set(svc.food)].map(f => (
                              <span key={f} style={{ display:'inline-flex', alignItems:'center', gap:4, background:'#f0faf4', color:'#2a5c3f', fontSize:12, fontWeight:500, padding:'4px 10px', borderRadius:100, border:'1px solid #c8e8d4' }}>
                                <span style={{ fontSize:13 }}>{foodEmoji(f)}</span>{f}
                              </span>
                            ))}
                          </div>
                        )}
                        {/* Schedule rows */}
                        <div>
                          {validSchedules.length > 0
                            ? validSchedules.map((s,j) => <ServiceScheduleRow key={j} sched={s} />)
                            : <span style={{ fontSize:12, color:'#6b7280', fontStyle:'italic', display:'block', padding:'4px 0' }}>Contact pantry for schedule details</span>
                          }
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

  const [radius,      setRadius]      = useState('10');

  const [filters,     setFilters]     = useState({ day:'', foodType:'', openNow:false });
  const [showFilters, setShowFilters] = useState(true);
  const [mapHighlightId, setMapHighlightId] = useState(null);

  const CENTER = { lat:42.3601, lon:-71.2088 };

  const filteredPantries = useMemo(() => {
    let r = PANTRIES_DATA;
    if (filters.day)      r = r.filter(p => p.schedules.some(s => s.weekDay === filters.day && s.start));
    if (filters.foodType) r = r.filter(p => p.services.some(s => s.food.includes(filters.foodType)));
    if (filters.openNow)  r = r.filter(p => isOpenNow(p.schedules));
    return r
      .map(p => ({ ...p, distance: haversineDistance(CENTER.lat, CENTER.lon, p.latitude, p.longitude) }))
      .filter(p => p.distance <= parseFloat(radius))
      .sort((a,b) => a.distance - b.distance);
  }, [filters, radius]);

  const activeCount = [filters.day, filters.foodType, filters.openNow].filter(Boolean).length;

                <polyline points="6 9 12 15 18 9"/>
              </svg>
            </div>
            {/* Search button — flush right inside pill */}
            <button style={{ background:'#1e7a47', color:'white', border:'none', padding:'0 24px', fontSize:14, fontWeight:600, cursor:'pointer', fontFamily:"'DM Sans',sans-serif", whiteSpace:'nowrap', transition:'background 0.2s', display:'flex', alignItems:'center', gap:7 }}

                    <div key={p.id} onClick={() => setMapHighlightId(p.id)}

                      onMouseEnter={e => { if (!isHighlighted) { e.currentTarget.style.borderColor='#1e7a47'; e.currentTarget.style.boxShadow='0 4px 16px rgba(30,122,71,0.08)'; }}}
                      onMouseLeave={e => { if (!isHighlighted) { e.currentTarget.style.borderColor='#edf3ef'; e.currentTarget.style.boxShadow='none'; }}}>
                      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:8, marginBottom:6 }}>

                    </div>
                  );

          )}
        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   SINGLE-PANTRY MAP (for detail page)
───────────────────────────────────────────────────────── */
function SinglePantryMap({ pantry }) {
  const containerRef = useRef(null);
  const mapRef       = useRef(null);

  useEffect(() => {
    const init = () => {
      if (!containerRef.current) return;
      if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
      const L   = window.L;
      const map = L.map(containerRef.current, {
        center: [pantry.latitude, pantry.longitude],
        zoom: 15, scrollWheelZoom: false,
      });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);
      const icon = L.divIcon({
        className: '',
        html: `<div style="background:#1e7a47;color:white;border-radius:50% 50% 50% 0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(30,122,71,0.35);border:2.5px solid white;transform:rotate(-45deg)"><span style="transform:rotate(45deg)">${pantry.name.charAt(0)}</span></div>`,
        iconSize: [40, 40], iconAnchor: [20, 40],
      });
      L.marker([pantry.latitude, pantry.longitude], { icon }).addTo(map);
      mapRef.current = map;
    };
    const loadLeaflet = () => {
      if (!document.getElementById('leaflet-css')) {
        const css = document.createElement('link');
        css.id = 'leaflet-css'; css.rel = 'stylesheet';
        css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
        document.head.appendChild(css);
      }
      if (window.L) { init(); return; }
      if (document.getElementById('leaflet-js')) {
        const poll = setInterval(() => { if (window.L) { clearInterval(poll); init(); } }, 80);
        return;
      }
      const js = document.createElement('script');
      js.id = 'leaflet-js';
      js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      js.onload = init;
      document.head.appendChild(js);
    };
    loadLeaflet();
    return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
  }, [pantry]);

  return <div ref={containerRef} style={{ width: '100%', height: '100%' }} />;
}

              <div style={{ fontSize:12, fontWeight:700, color:'#9ca3af', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:14 }}>Contact</div>
              {pantry.phone && (
                <a href={`tel:${pantry.phone}`} style={{ display:'flex', alignItems:'center', gap:10, textDecoration:'none', marginBottom:12 }}>
                  <div style={{ width:34, height:34, borderRadius:9, background:'#f0faf4', border:'1px solid #c8e8d4', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                    <IcoPhone size={15} color="#1e7a47" />
                  </div>
                  <div>
                    <div style={{ fontSize:13, fontWeight:600, color:'#1f2937' }}>{pantry.phone}</div>
                    <div style={{ fontSize:11, color:'#9ca3af' }}>Tap to call</div>
                  </div>
                </a>
              )}
              <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(pantry.address)}`} target="_blank" rel="noreferrer" style={{ display:'flex', alignItems:'center', gap:10, textDecoration:'none' }}>
                <div style={{ width:34, height:34, borderRadius:9, background:'#f0faf4', border:'1px solid #c8e8d4', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                  <IcoMapPin size={15} color="#1e7a47" />
                </div>
                <div>
                  <div style={{ fontSize:13, fontWeight:600, color:'#1f2937' }}>Get Directions</div>
                  <div style={{ fontSize:11, color:'#9ca3af' }}>Open in Google Maps</div>
                </div>
              </a>
            </div>
          )}

          {/* Available Food card */}
          {allFoods.length > 0 && (
            <div style={{ background:'white', borderRadius:16, padding:'20px', border:'1px solid #edf3ef', boxShadow:'0 1px 6px rgba(0,0,0,0.04)' }}>
              <div style={{ fontSize:12, fontWeight:700, color:'#9ca3af', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:14 }}>Available Food</div>
              <div style={{ display:'flex', flexWrap:'wrap', gap:7 }}>
                {allFoods.map(f => (
                  <span key={f} style={{ display:'inline-flex', alignItems:'center', gap:5, background:'#f0faf4', color:'#2a5c3f', fontSize:12, fontWeight:500, padding:'5px 11px', borderRadius:100, border:'1px solid #c8e8d4' }}>
                    <span style={{ fontSize:14 }}>{foodEmoji(f)}</span>{f}
                  </span>
                ))}
              </div>
            </div>
          )}

          {/* Stats card */}
          <div style={{ background:'white', borderRadius:16, padding:'20px', border:'1px solid #edf3ef', boxShadow:'0 1px 6px rgba(0,0,0,0.04)' }}>
            <div style={{ fontSize:12, fontWeight:700, color:'#9ca3af', textTransform:'uppercase', letterSpacing:'0.07em', marginBottom:14 }}>Community</div>
            <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:12 }}>
              <div style={{ textAlign:'center', padding:'14px 10px', background:'#fff1f2', borderRadius:12, border:'1px solid #fca5a5' }}>
                <div style={{ fontSize:22, fontWeight:700, color:'#e11d48', fontFamily:"'Playfair Display',Georgia,serif" }}>{loveCount}</div>
                <div style={{ fontSize:11, color:'#9b1c3a', fontWeight:500, marginTop:2 }}>loves</div>
              </div>
              <div style={{ textAlign:'center', padding:'14px 10px', background:'#f0faf4', borderRadius:12, border:'1px solid #b8e8cc' }}>
                <div style={{ fontSize:22, fontWeight:700, color:'#1e7a47', fontFamily:"'Playfair Display',Georgia,serif" }}>{pantry.followers ?? '—'}</div>
                <div style={{ fontSize:11, color:'#1a6038', fontWeight:500, marginTop:2 }}>followers</div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────
   APP
───────────────────────────────────────────────────────── */
function App() {
  const [page,           setPage]          = useState('landing');
  const [searchQuery,    setSearchQuery]   = useState('Newton, MA');
  const [isLoggedIn,     setIsLoggedIn]    = useState(false);
  const [currentUser,    setCurrentUser]   = useState(null);
  const [modal,          setModal]         = useState(null);
  const [selectedPantry, setSelectedPantry]= useState(null);
  const [detailPantry,   setDetailPantry]  = useState(null);
  const [lovedPantries,  setLovedPantries] = useState(new Set());
  const [followedPantries,setFollowedPantries]=useState(new Set());
  const [loveCounts,     setLoveCounts]    = useState({});

  const handleSearch = (q) => { setSearchQuery(q || 'Newton, MA'); setPage('search'); };

  const handleLogin = (user) => { setCurrentUser(user); setIsLoggedIn(true); };

  const handleViewDetail = (pantry) => {
    setSelectedPantry(null);   // close modal
    setDetailPantry(pantry);
    setPage('detail');
  };

  const handleLove = (pantryId) => {
    if (!isLoggedIn) { setModal('login'); return; }
    const next = new Set(lovedPantries);
    const wasLoved = lovedPantries.has(pantryId);
    wasLoved ? next.delete(pantryId) : next.add(pantryId);
    setLovedPantries(next);
    setLoveCounts(c => ({ ...c, [pantryId]: (PANTRIES_DATA.find(p=>p.id===pantryId)?.loves||0) + (wasLoved?0:1) }));
  };

  const handleFollow = (pantryId) => {
    if (!isLoggedIn) { setModal('login'); return; }
    const next = new Set(followedPantries);
    followedPantries.has(pantryId) ? next.delete(pantryId) : next.add(pantryId);
    setFollowedPantries(next);
  };

  return (
    <div style={{ minHeight:'100vh', position:'relative', zIndex:1 }}>

      {/* ══ HEADER ══ */}
      <header style={{ position:'fixed', top:0, left:0, right:0, zIndex:50, background:'rgba(253,251,247,0.92)', backdropFilter:'blur(12px)', borderBottom:'1px solid #edf3ef' }}>
        <div style={{ maxWidth:1120, margin:'0 auto', padding:'0 24px', height:64, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <a href="#" onClick={e=>{e.preventDefault();setPage('landing');}} style={{ display:'flex', alignItems:'center', gap:8, textDecoration:'none' }}>
            <span style={{ fontSize:24 }}>🌿</span>
            <span style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:20, color:'#1a2e1e' }}>PantryFinder</span>
          </a>
          <nav style={{ display:'flex', alignItems:'center', gap:32 }}>
            <a href="#" className="nav-link" onClick={e=>{e.preventDefault();handleSearch('Newton, MA');}} style={{ fontSize:14, color:'#4a6355', textDecoration:'none', fontWeight:500 }}>Find Pantries</a>
            {['How It Works','Add a Pantry','Volunteer'].map(l => (
              <a key={l} href="#" className="nav-link" style={{ fontSize:14, color:'#4a6355', textDecoration:'none', fontWeight:500 }}>{l}</a>
            ))}
          </nav>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            {isLoggedIn ? (
              <div style={{ display:'flex', alignItems:'center', gap:12 }}>
                {currentUser?.via === 'google' ? (
                  <div style={{ width:34, height:34, borderRadius:'50%', background:'linear-gradient(135deg,#4285F4,#34A853)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                    <svg width="16" height="16" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                      <g>
                        <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908C16.658 14.252 17.64 11.926 17.64 9.2z" fill="white"/>
                        <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="white"/>
                        <path d="M3.964 10.706A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="white"/>
                        <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="white"/>
                      </g>
                    </svg>
                  </div>
                ) : (
                  <div style={{ width:34, height:34, borderRadius:'50%', background:'#dcf4e6', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:600, fontSize:12, color:'#1e7a47' }}>
                    {currentUser?.name ? currentUser.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase() : 'JD'}
                  </div>
                )}
                <span style={{ fontSize:14, color:'#4a6355', fontWeight:500 }}>{currentUser?.name?.split(' ')[0] || 'User'}</span>
                <button onClick={()=>{ setIsLoggedIn(false); setCurrentUser(null); }} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, color:'#8aab97' }}>Sign out</button>
              </div>
            ) : (
              <>
                <button onClick={()=>setModal('login')} style={{ background:'none', border:'none', cursor:'pointer', fontSize:14, fontWeight:500, color:'#4a6355', padding:'8px 14px' }}>Sign in</button>
                <button onClick={()=>setModal('register')} style={{ background:'#1e7a47', border:'none', cursor:'pointer', fontSize:14, fontWeight:600, color:'white', padding:'9px 20px', borderRadius:10 }}>Register free</button>
              </>
            )}
          </div>
        </div>
      </header>

      {/* ══ PAGE CONTENT ══ */}
      {page === 'landing' && (
        <div style={{ paddingTop:64 }}>
          <LandingPage onSearch={handleSearch} onOpenModal={setModal} />
        </div>
      )}

      {page === 'search' && (
        <SearchPage
          initQuery={searchQuery}
          onBack={() => setPage('landing')}
          onSelect={setSelectedPantry}
          lovedPantries={lovedPantries}
          followedPantries={followedPantries}
          loveCounts={loveCounts}
          onLove={handleLove}
          onFollow={handleFollow}
          onOpenModal={setModal}
        />
      )}

      {page === 'detail' && detailPantry && (
        <PantryDetailPage
          pantry={detailPantry}
          loved={lovedPantries.has(detailPantry.id)}
          followed={followedPantries.has(detailPantry.id)}
          loveCounts={loveCounts}
          onLove={handleLove}
          onFollow={handleFollow}
          onBack={() => { setPage('search'); setDetailPantry(null); }}
        />
      )}

      {/* ══ PANTRY DETAIL MODAL ══ */}
      {selectedPantry && (
        <PantryDetailModal
          pantry={selectedPantry}
          loved={lovedPantries.has(selectedPantry.id)}
          followed={followedPantries.has(selectedPantry.id)}
          loveCounts={loveCounts}
          onLove={handleLove}
          onFollow={handleFollow}
          onViewDetail={handleViewDetail}
          onClose={() => setSelectedPantry(null)}
        />
      )}

      {/* ══ AUTH MODALS ══ */}
      {modal === 'login'    && <LoginModal    onClose={()=>setModal(null)} onSwitch={()=>setModal('register')} onLogin={handleLogin} />}
      {modal === 'register' && <RegisterModal onClose={()=>setModal(null)} onSwitch={()=>setModal('login')}    onLogin={handleLogin} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
