/* ── Intersection Observer Hook ── */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
    const obs = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); } });
    }, { threshold: 0.12 });
    els.forEach(el => obs.observe(el));
    return () => obs.disconnect();
  }, []);
}

          <span style={{ fontSize:12, letterSpacing:'0.1em', fontWeight:500 }}>EXPLORE</span>
          <svg width="16" height="24" viewBox="0 0 16 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round">
            <path d="M8 2v20M2 16l6 6 6-6"/>
          </svg>
        </div>
      </section>

      {/* ══ STATS ══ */}
      <section style={{ background:'white', borderTop:'1px solid #edf3ef', borderBottom:'1px solid #edf3ef' }}>
        <div style={{ maxWidth:1120, margin:'0 auto', padding:'0 24px' }}>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:0 }}>
            {STATS.map((s, i) => (
              <div key={i} className="reveal" style={{ padding:'44px 32px', borderRight: i < 3 ? '1px solid #edf3ef' : 'none', textAlign:'center', transitionDelay: `${i*0.1}s` }}>
                <div style={{ fontSize:28, marginBottom:10 }}>{s.icon}</div>
                <div className="stat-number">{s.number}</div>
                <div style={{ fontSize:14, color:'#8aab97', marginTop:8, fontWeight:400 }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ══ HOW IT WORKS ══ */}
      <section style={{ padding:'100px 24px', background:'var(--cream)' }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:64 }}>
            <span className="tag-pill reveal" style={{ background:'#dcf4e6', color:'#1e7a47' }}>How It Works</span>
            <h2 className="reveal" style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:'clamp(32px,4vw,52px)', color:'#1a2e1e', marginTop:16, letterSpacing:'-0.02em', lineHeight:1.15 }}>
              Three steps to your<br/><span style={{ fontFamily:'Playfair Display,Georgia,serif', fontStyle:'italic', fontWeight:500, color:'#2d9a5f' }}>nearest pantry</span>
            </h2>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:40, position:'relative' }}>
            {/* Single connector spanning full width at icon-center height (54px from top).
                Numbers sit above this line at 0–26px, so they never interfere.
                Icon boxes (background #f0faf4) visually break the line at each step.
                The line extends past icon3 naturally, giving the desired trailing dash. */}
            <div style={{ position:'absolute', top:58, left:0, right:0, height:0, zIndex:0, borderTop:'2px dashed #b8e8cc' }}/>

            {STEPS.map((s, i) => (
              <div key={i} className="reveal" style={{ transitionDelay:`${i*0.15}s`, position:'relative', zIndex:1 }}>
                <div style={{ marginBottom:24 }}>
                  {/* Number above the icon — sits above the connector line, no overlap */}
                  <span style={{ display:'block', width:56, textAlign:'center', fontFamily:'Playfair Display,Georgia,serif', fontSize:16, fontWeight:600, color:'#b8e8cc', letterSpacing:'0.12em', marginBottom:8 }}>{s.num}</span>
                  {/* Icon box with solid background — breaks the connector line at this position */}
                  <div style={{ width:56, height:56, borderRadius:16, background:'#f0faf4', border:'2px solid #b8e8cc', display:'flex', alignItems:'center', justifyContent:'center', color:'#1e7a47' }}>
                    {s.icon}
                  </div>
                </div>
                <h3 style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:22, color:'#1a2e1e', marginBottom:12 }}>{s.title}</h3>
                <p style={{ fontSize:15, color:'#4a6355', lineHeight:1.7, fontWeight:300 }}>{s.desc}</p>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ══ FOOD CATEGORIES ══ */}
      <section style={{ padding:'100px 24px', background:'#f0faf4' }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:80, alignItems:'center' }}>
            <div>
              <span className="tag-pill reveal" style={{ background:'white', color:'#1e7a47' }}>What's Available</span>
              <h2 className="reveal" style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:'clamp(28px,3.5vw,46px)', color:'#1a2e1e', marginTop:16, marginBottom:20, letterSpacing:'-0.02em', lineHeight:1.15 }}>
                Food for every<br/>need &amp; culture
              </h2>
              <p className="reveal" style={{ fontSize:16, color:'#4a6355', lineHeight:1.75, fontWeight:300, marginBottom:32, maxWidth:420 }}>
                Our pantries collectively stock a wide variety of items — from fresh produce to culturally specific ingredients, baby essentials to pet supplies. No one slips through.
              </p>
              <button className="reveal" style={{ background:'#1e7a47', border:'none', color:'white', fontWeight:600, fontSize:14, padding:'13px 28px', borderRadius:12, cursor:'pointer' }}>
                Search All Pantries →
              </button>
            </div>

            <div style={{ display:'flex', flexWrap:'wrap', gap:10 }}>
              {CATEGORIES.map((c, i) => (
                <div key={i} className="cat-pill reveal" style={{ transitionDelay:`${(i%4)*0.08}s` }}>
                  <span style={{ fontSize:18 }}>{c.icon}</span>
                  <span>{c.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* ══ TESTIMONIALS ══ */}
      <section style={{ padding:'100px 24px', background:'white' }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ textAlign:'center', marginBottom:64 }}>
            <span className="tag-pill reveal" style={{ background:'#faf5ec', color:'#a07850' }}>Community Voices</span>
            <h2 className="reveal" style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:'clamp(28px,3.5vw,46px)', color:'#1a2e1e', marginTop:16, letterSpacing:'-0.02em', lineHeight:1.15 }}>
              Real people,<br/><span style={{ fontFamily:'Playfair Display,Georgia,serif', fontStyle:'italic', fontWeight:500, color:'#2d9a5f' }}>real stories</span>
            </h2>
          </div>

          <div style={{ display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:24 }}>
            {TESTIMONIALS.map((t, i) => (
              <div key={i} className="testimonial-card reveal" style={{ transitionDelay:`${i*0.15}s` }}>
                <Stars />
                <p style={{ fontSize:15, color:'#4a6355', lineHeight:1.75, margin:'16px 0 24px', fontWeight:300, fontStyle:'italic' }}>
                  "{t.quote}"
                </p>
                <div style={{ display:'flex', alignItems:'center', gap:12, borderTop:'1px solid #edf3ef', paddingTop:20 }}>
                  <Avatar initials={t.avatar} color={t.color} />
                  <div>
                    <div style={{ fontWeight:600, fontSize:14, color:'#1a2e1e' }}>{t.name}</div>
                    <div style={{ fontSize:13, color:'#8aab97' }}>{t.location}</div>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ══ FOR PANTRY OPERATORS ══ */}
      <section style={{ padding:'100px 24px', background:'var(--cream)' }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ background:'white', borderRadius:28, padding:'64px', display:'grid', gridTemplateColumns:'1fr auto', gap:48, alignItems:'center', border:'1.5px solid #edf3ef', boxShadow:'0 4px 40px rgba(30,122,71,0.06)' }}>
            <div>
              <span className="tag-pill reveal" style={{ background:'#faf5ec', color:'#a07850' }}>For Pantry Operators</span>
              <h2 className="reveal" style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:'clamp(28px,3.5vw,44px)', color:'#1a2e1e', marginTop:16, marginBottom:16, letterSpacing:'-0.02em', lineHeight:1.15 }}>
                Run a pantry?<br/>List it <span style={{ fontFamily:'Playfair Display,Georgia,serif', fontStyle:'italic', fontWeight:500, color:'#2d9a5f' }}>for free.</span>
              </h2>
              <p className="reveal" style={{ fontSize:16, color:'#4a6355', lineHeight:1.75, fontWeight:300, maxWidth:480 }}>
                Thousands of families search PantryFinder every week. Get listed in minutes — manage your schedule, food availability, and contact info all in one place.
              </p>
              <div className="reveal" style={{ display:'flex', gap:12, marginTop:32 }}>
                <button style={{ background:'#1e7a47', border:'none', color:'white', fontWeight:600, fontSize:14, padding:'13px 28px', borderRadius:12, cursor:'pointer' }}>
                  Add Your Pantry →
                </button>
                <button style={{ background:'transparent', border:'1.5px solid #dde8e2', color:'#4a6355', fontWeight:500, fontSize:14, padding:'13px 24px', borderRadius:12, cursor:'pointer' }}>
                  Learn More
                </button>
              </div>
            </div>

            <div className="reveal-right" style={{ display:'flex', flexDirection:'column', gap:16, minWidth:240 }}>
              {[
                { icon:'⚡', text:'Live in under 5 minutes' },
                { icon:'📅', text:'Real-time schedule management' },
                { icon:'📊', text:'See who\'s visiting your listing' },
                { icon:'💸', text:'Completely free, forever' },
              ].map((f, i) => (
                <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 18px', background:'#f0faf4', borderRadius:12 }}>
                  <span style={{ fontSize:20 }}>{f.icon}</span>
                  <span style={{ fontSize:14, color:'#4a6355', fontWeight:500 }}>{f.text}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>

      {/* ══ CTA BAND ══ */}
      <section className="cta-band" style={{ padding:'90px 24px' }}>
        <div style={{ maxWidth:700, margin:'0 auto', textAlign:'center', position:'relative', zIndex:1 }}>
          <span style={{ fontSize:48, display:'block', marginBottom:20 }}>🌿</span>
          <h2 className="reveal" style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:'clamp(30px,4vw,54px)', color:'white', marginBottom:16, letterSpacing:'-0.02em', lineHeight:1.1 }}>
            No one should go<br/>hungry in our community.
          </h2>
          <p className="reveal" style={{ fontSize:18, color:'rgba(255,255,255,0.7)', marginBottom:44, lineHeight:1.65, fontWeight:300 }}>
            Start your search now — it takes less than 30 seconds to find a pantry near you.
          </p>
          <div className="reveal" style={{ display:'flex', gap:12, justifyContent:'center', flexWrap:'wrap' }}>
            <button style={{ background:'white', border:'none', color:'#1e7a47', fontWeight:700, fontSize:15, padding:'14px 32px', borderRadius:14, cursor:'pointer' }}>
              Find a Pantry Near Me
            </button>
            <button onClick={()=>setModal('register')} style={{ background:'rgba(255,255,255,0.12)', border:'1.5px solid rgba(255,255,255,0.3)', color:'white', fontWeight:500, fontSize:15, padding:'14px 28px', borderRadius:14, cursor:'pointer' }}>
              Create Free Account
            </button>
          </div>
        </div>
      </section>

      {/* ══ FOOTER ══ */}
      <footer style={{ background:'#1a2e1e', padding:'60px 24px 36px' }}>
        <div style={{ maxWidth:1120, margin:'0 auto' }}>
          <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr 1fr', gap:48, marginBottom:48 }}>
            <div>
              <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:16 }}>
                <span style={{ fontSize:22 }}>🌿</span>
                <span style={{ fontFamily:'Playfair Display,Georgia,serif', fontWeight:600, fontSize:18, color:'white' }}>PantryFinder</span>
              </div>
              <p style={{ fontSize:14, color:'rgba(255,255,255,0.45)', lineHeight:1.75, maxWidth:280, fontWeight:300 }}>
                Connecting communities with food resources since 2021. Free, private, and always here.
              </p>
            </div>
            {[
              { heading:'For Visitors', links:['Find Pantries','Map View','Food Categories','FAQ'] },
              { heading:'For Pantries', links:['Add Your Pantry','Manage Listing','Volunteer','Partner With Us'] },
              { heading:'Organization', links:['About Us','Press','Contact','Privacy Policy'] },
            ].map((col, i) => (
              <div key={i}>
                <h4 style={{ fontSize:12, fontWeight:600, color:'rgba(255,255,255,0.35)', letterSpacing:'0.1em', textTransform:'uppercase', marginBottom:16 }}>{col.heading}</h4>
                <ul style={{ listStyle:'none', display:'flex', flexDirection:'column', gap:10 }}>
                  {col.links.map(l => (
                    <li key={l}><a href="#" style={{ fontSize:14, color:'rgba(255,255,255,0.55)', textDecoration:'none', transition:'color 0.2s' }}
                      onMouseEnter={e=>e.target.style.color='white'} onMouseLeave={e=>e.target.style.color='rgba(255,255,255,0.55)'}>{l}</a></li>
                  ))}
                </ul>
              </div>
            ))}
          </div>
          <div style={{ borderTop:'1px solid rgba(255,255,255,0.08)', paddingTop:28, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:16 }}>
            <span style={{ fontSize:13, color:'rgba(255,255,255,0.3)' }}>© 2025 PantryFinder. Made with care for every community.</span>
            <span style={{ fontSize:13, color:'rgba(255,255,255,0.3)' }}>Free forever · No ads · No tracking</span>
          </div>
        </div>
      </footer>

      {/* ══ MODALS ══ */}
      {modal === 'login'    && <LoginModal    onClose={()=>setModal(null)} onSwitch={()=>setModal('register')} />}
      {modal === 'register' && <RegisterModal onClose={()=>setModal(null)} onSwitch={()=>setModal('login')} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
