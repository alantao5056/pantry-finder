# Redis settings for the pantry-finder API cache.
# Apply on the host by appending to /etc/redis/redis.conf (or as an include),
# then: sudo systemctl restart redis-server
#
# Ubuntu's redis-server package defaults are otherwise kept as-is:
# - bind 127.0.0.1 ::1 and protected-mode yes (loopback only, no auth needed)
# - RDB snapshotting on, so the cache also survives Redis/host restarts

# Replaces the per-cache `max` entry counts the API used with lru-cache: one
# global memory bound with LRU eviction across all keys. allkeys-lru (rather
# than volatile-ttl) so any key accidentally set without a TTL still evicts.
maxmemory 128mb
maxmemory-policy allkeys-lru
